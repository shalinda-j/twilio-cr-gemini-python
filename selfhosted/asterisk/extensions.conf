; extensions.conf - dialplan.
;   * Dial 1000 from a softphone  -> AI (no DID; attributed to the first company)
;   * Real inbound calls (SIP trunk / GoIP / 3CX) arrive on the dialed number,
;     get registered to the right company, then handed to the AI.
;
; Needs: func_curl, func_filter, func_shell, app_audiosocket.
; UUIDs come from the Linux kernel (/proc/sys/kernel/random/uuid) so no extra
; packages (uuidgen) are needed; a static fallback keeps calls alive even if
; func_shell is unavailable.

[ai]
; --- Softphone test ---------------------------------------------------------
exten => 1000,1,NoOp(Softphone test call)
 same => n,Answer()
 same => n,Set(SOCKUUID=${FILTER(0-9a-f-,${SHELL(cat /proc/sys/kernel/random/uuid)})})
 same => n,ExecIf($[${LEN(${SOCKUUID})} < 32]?Set(SOCKUUID=40325ec2-5efd-4bd3-805f-53576e581d13))
 same => n,AudioSocket(${SOCKUUID},127.0.0.1:8090)
 same => n,Hangup()

; --- Real inbound (SIP trunk DID / GoIP / 3CX) ------------------------------
; ${EXTEN} is the dialed number. We POST the call->DID->company mapping to the
; dashboard, then connect the AI using the SAME uuid. The CURL step is best-
; effort: if it fails the call still reaches the AI (dashboard uses fallback).
exten => _X.,1,NoOp(Inbound ${EXTEN} from ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(SOCKUUID=${FILTER(0-9a-f-,${SHELL(cat /proc/sys/kernel/random/uuid)})})
 same => n,ExecIf($[${LEN(${SOCKUUID})} < 32]?Set(SOCKUUID=40325ec2-5efd-4bd3-805f-53576e581d13))
 same => n,Set(CURLOPT(httptimeout)=3)
 same => n,Set(ROUTE=${CURL(${ENV(DASHBOARD_URL)}/api/internal/route,call_uuid=${SOCKUUID}&did=${EXTEN}&caller=${CALLERID(num)}&token=${ENV(INGEST_TOKEN)})})
 same => n,AudioSocket(${SOCKUUID},127.0.0.1:8090)
 same => n,Hangup()

; Also catch alphanumeric/SIP-uri style extensions some PBXes (3CX) send.
exten => _[a-zA-Z].,1,Goto(ai,1000,1)
