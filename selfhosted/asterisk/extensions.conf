; extensions.conf - dialplan.
;   * Dial 1000 from a softphone  -> AI (no DID; attributed to the first company)
;   * Real inbound calls (from a SIP trunk) arrive on the dialed number (DID),
;     get registered to the right company, then handed to the AI.
;
; Needs these Asterisk modules: func_curl, func_filter, func_shell, app_audiosocket,
; and the `uuidgen` binary (util-linux). The full andrius/asterisk image has them.

[ai]
; --- Softphone test ---------------------------------------------------------
exten => 1000,1,NoOp(Softphone test call)
 same => n,Answer()
 same => n,Set(SOCKUUID=${FILTER(0-9a-f-,${SHELL(uuidgen)})})
 same => n,AudioSocket(${SOCKUUID},127.0.0.1:8090)
 same => n,Hangup()

; --- Real inbound from a SIP trunk -----------------------------------------
; ${EXTEN} is the dialed number (your DID). We POST the call->DID->company
; mapping to the dashboard, then connect the AI using the SAME uuid.
exten => _X.,1,NoOp(Inbound ${EXTEN} from ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(SOCKUUID=${FILTER(0-9a-f-,${SHELL(uuidgen)})})
 same => n,Set(CURLOPT(httptimeout)=3)
 same => n,Set(ROUTE=${CURL(${ENV(DASHBOARD_URL)}/api/internal/route,call_uuid=${SOCKUUID}&did=${EXTEN}&caller=${CALLERID(num)}&token=${ENV(INGEST_TOKEN)})})
 same => n,AudioSocket(${SOCKUUID},127.0.0.1:8090)
 same => n,Hangup()
