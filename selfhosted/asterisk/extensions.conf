; extensions.conf - dialplan. Dialing 1000 hands the call to our AI via AudioSocket.

[ai]
; The first AudioSocket argument is a UUID (any valid one works for a single call).
; The second is host:port of our Python server (same host => 127.0.0.1).
exten => 1000,1,Answer()
 same => n,Ringing()
 same => n,AudioSocket(40325ec2-5efd-4bd3-805f-53576e581d13,127.0.0.1:8090)
 same => n,Hangup()

; When you connect a real number via a SIP trunk, route its inbound DID here too, e.g.:
; exten => _X.,1,Goto(ai,1000,1)
