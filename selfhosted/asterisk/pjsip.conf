; pjsip.conf - SIP endpoint for a softphone (extension 1000) to test the AI.
; Add a [trunk] section later to connect a real phone number via a SIP trunk.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

;----------------------------------------------------------------------
; Softphone endpoint "1000" - register Zoiper/Linphone with these creds.
;----------------------------------------------------------------------
[1000]
type=endpoint
context=ai
disallow=all
allow=ulaw
allow=alaw
auth=1000-auth
aors=1000-aor

[1000-auth]
type=auth
auth_type=userpass
username=1000
password=ChangeMe_StrongPass123

[1000-aor]
type=aor
max_contacts=1

;----------------------------------------------------------------------
; SIP TRUNK - uncomment and fill in to take REAL calls from a provider.
; Get server/username/password/DID from your SIP trunk provider, then add
; the DID as a number in the dashboard (assigned to the right company).
;----------------------------------------------------------------------
;[trunk-reg]
;type=registration
;transport=transport-udp
;outbound_auth=trunk-auth
;server_uri=sip:sip.provider.com
;client_uri=sip:YOUR_USERNAME@sip.provider.com
;retry_interval=60
;
;[trunk-auth]
;type=auth
;auth_type=userpass
;username=YOUR_USERNAME
;password=YOUR_PASSWORD
;
;[trunk-aor]
;type=aor
;contact=sip:sip.provider.com
;
;[trunk]
;type=endpoint
;transport=transport-udp
;context=ai
;disallow=all
;allow=ulaw
;allow=alaw
;outbound_auth=trunk-auth
;aors=trunk-aor
;from_user=YOUR_USERNAME
;
;[trunk-identify]
;type=identify
;endpoint=trunk
;match=sip.provider.com

;----------------------------------------------------------------------
; GSM GATEWAY (GoIP) - use a PHYSICAL mobile SIM with the AI.
; Put your SIM in the GoIP, point its "VoIP/SIP server" at this droplet's
; public IP:5060, and register with these credentials. Incoming GSM calls
; then flow into context "ai" and reach the assistant. Calls from the SIM
; land on the dialplan; route them with the existing _X. pattern (or 'gsm').
;----------------------------------------------------------------------
;[goip]
;type=endpoint
;transport=transport-udp
;context=ai
;disallow=all
;allow=ulaw
;allow=alaw
;auth=goip-auth
;aors=goip-aor
;
;[goip-auth]
;type=auth
;auth_type=userpass
;username=goip
;password=ChangeMe_GoIP_Pass
;
;[goip-aor]
;type=aor
;max_contacts=1
